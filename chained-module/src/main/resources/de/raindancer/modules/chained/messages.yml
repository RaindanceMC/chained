# Rain's Chained — every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins, and so
# does a host's bundled wording. See Messages.defineFrom.
chained:

  # ---------------------------------------------------------------- the wall
  wall: "<red>You are chained, and going further would pull you apart. Stay close."

  # ---------------------------------------------------------------- pairing
  paired: "<green><white><first></white> and <white><second></white> are chained, up to <white><distance></white> blocks apart."
  pair-refused: "<red>They could not be chained: <white><reason></white>."
  not-paired: "<red><white><name></white> is not chained to anybody."
  unpaired: "<green><white><name></white> is no longer chained to anybody."
  unknown-player: "<red>There is nobody online called <white><name></white>."
  player-offline: "<red><white><name></white> is offline. Both players must be online to be chained."
  too-many: "<red><white><typed></white> matches <white><count></white> players. Pick one."
  selector-refused: "<red>Selectors like <white><typed></white> are not allowed here, or are not written correctly. Type a name instead."

  # ---------------------------------------------------------------- running
  started: "<green>The clock is running."
  start-refused: "<red>Could not start a run. You are not chained yet, or a run is already going."
  stopped: "<yellow>The run is stopped. The chains stay on."
  stop-refused: "<red>There is no run of yours to stop."

  # ---------------------------------------------------------------- resetting
  reset-done: "<green>The map has been reset."
  reset-refused: "<red>The map could not be reset. Check that the configured world is loaded."

  # ---------------------------------------------------------------- general
  only-a-player: "<red>Only a player in the game can do that."
  not-yours: "<red>You cannot change chains. Ask the staff."

  usage:
    pair: "<gray>/chain pair <first player> <second player> [max distance]"
    unpair: "<gray>/chain unpair <player>"
    reset: "<gray>/chain reset [seed <a number|random>]"

  help:
    - "<gray>/chain<dark_gray>: how far apart you may go, and the clock"
    - "<gray>/chain status<dark_gray>: the same, as a menu"
    - "<gray>/chain start<dark_gray>: start the run for your pair"
    - "<gray>/chain stop<dark_gray>: end it early"
    - "<dark_gray>/chain admin<dark_gray>: pairing, and resetting the map"
